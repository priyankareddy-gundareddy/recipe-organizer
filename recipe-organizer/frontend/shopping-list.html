<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <link rel="stylesheet" href="css/shopping-list.css">
</head>

<body>

<header class="header">
    <h1>🛒 Shopping List</h1>

    <div>
        <button onclick="location.href='dashboard.html'">
            Dashboard
        </button>

        <button id="logoutBtn">
            Logout
        </button>
    </div>
</header>

<main class="container">

    <section class="generate-section">

        <h2>Generate Shopping List</h2>

        <p>Select the recipes you want to prepare:</p>

        <div id="recipeSelection">
            <p>Loading recipes...</p>
        </div>

        <button id="generateBtn">
            Generate Shopping List
        </button>

    </section>


    <section class="shopping-section">

        <h2>My Shopping List</h2>

        <div id="shoppingList">
            <p>Loading shopping list...</p>
        </div>

    </section>

</main>

<script src="js/shopping-list.js"></script>

</body>
</html>
