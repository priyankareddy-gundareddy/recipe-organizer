<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Recipe</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            min-height: 100px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .update-btn {
            width: 100%;
            background: #667eea;
            color: white;
            font-size: 16px;
        }

        .back-btn {
            background: #ddd;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✏️ Edit Recipe</h1>

    <form id="editRecipeForm">

        <label>Title</label>
        <input type="text" id="title" required>

        <label>Category</label>
        <input type="text" id="category" required>

        <label>Description</label>
        <textarea id="description" required></textarea>

        <label>Ingredients</label>
        <textarea id="ingredients" required></textarea>

        <label>Instructions</label>
        <textarea id="instructions" required></textarea>

        <button type="submit" class="update-btn">
            Update Recipe
        </button>

    </form>

    <button class="back-btn"
            onclick="window.location.href='recipes.html'">
        ← Back to My Recipes
    </button>

    <p id="message"></p>

</div>

<script src="js/edit-recipe.js"></script>

</body>

</html>
